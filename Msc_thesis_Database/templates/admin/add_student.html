{% extends "admin/base.html" %}
{% block content %}
<h2 class="text-center mb-4">Add Student</h2>

<form method="POST">
{% csrf_token %}

<div class="mb-3">
  <label class="form-label">User Account</label>
  <select class="form-select" name="user" required>
    {% for u in users %}
    <option value="{{ u.id }}">{{ u.username }} ({{ u.email }})</option>
    {% endfor %}
  </select>
</div>

<div class="mb-3">
  <label class="form-label">Batch</label>
  <input type="text" class="form-control" name="batch" required>
</div>

<div class="mb-3">
  <label class="form-label">Program</label>
  <input type="text" class="form-control" name="program" required>
</div>

<div class="mb-3">
  <label class="form-label">Department</label>
  <select class="form-select" name="department" required>
    {% for dept in departments %}
    <option value="{{ dept.department_id }}">{{ dept.department_name }}</option>
    {% endfor %}
  </select>
</div>

<button type="submit" class="btn btn-success w-100">Save Student</button>
</form>
{% endblock %}
