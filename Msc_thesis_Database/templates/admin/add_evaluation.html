{% extends "admin/base.html" %}
{% block content %}
<h2 class="text-center mb-4">Add Evaluation</h2>

<form method="POST">
{% csrf_token %}

<div class="mb-3">
  <label class="form-label">Thesis</label>
  <select class="form-select" name="thesis" required>
    {% for t in thesis_list %}
    <option value="{{ t.thesis_id }}">{{ t.title }}</option>
    {% endfor %}
  </select>
</div>

<div class="mb-3">
  <label class="form-label">Evaluation Date</label>
  <input type="date" class="form-control" name="evaluation_date" required>
</div>

<div class="mb-3">
  <label class="form-label">Marks</label>
  <input type="number" step="0.01" class="form-control" name="marks" required>
</div>

<div class="mb-3">
  <label class="form-label">Result</label>
  <select class="form-select" name="result" required>
    <option value="Pass">Pass</option>
    <option value="Fail">Fail</option>
  </select>
</div>

<button type="submit" class="btn btn-secondary w-100">Save Evaluation</button>
</form>
{% endblock %}
