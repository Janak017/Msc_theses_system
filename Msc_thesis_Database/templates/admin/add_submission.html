{% extends "admin/base.html" %}
{% block content %}
<h2 class="text-center mb-4">Add Submission</h2>

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<div class="mb-3">
  <label class="form-label">Thesis</label>
  <select class="form-select" name="thesis" required>
    {% for t in thesis_list %}
    <option value="{{ t.thesis_id }}">{{ t.title }}</option>
    {% endfor %}
  </select>
</div>

<div class="mb-3">
  <label class="form-label">Submission Date</label>
  <input type="date" class="form-control" name="submission_date" required>
</div>

<div class="mb-3">
  <label class="form-label">Version</label>
  <input type="number" class="form-control" name="version" required>
</div>

<div class="mb-3">
  <label class="form-label">Approval Status</label>
  <select class="form-select" name="approval_status" required>
    <option value="Pending">Pending</option>
    <option value="Approved">Approved</option>
    <option value="Rejected">Rejected</option>
  </select>
</div>

<div class="mb-3">
  <label class="form-label">Upload Thesis File</label>
  <input type="file" class="form-control" name="thesis_file">
</div>

<button type="submit" class="btn btn-danger w-100">Save Submission</button>
</form>
{% endblock %}
