<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - MSc Thesis System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
    body { background-color: #f8f9fa; }
    h2 { margin-bottom: 30px; text-align:center; }
    .card i { font-size: 40px; margin-bottom: 10px; }
    .card a { text-decoration: none; }
    .card:hover { transform: translateY(-5px); transition: 0.3s; }
</style>
</head>
<body>

<div class="container mt-5">
    <h2>MSc Thesis System - Admin Dashboard</h2>
    <div class="row g-4">

        <div class="col-md-4">
            <div class="card text-white bg-primary text-center">
                <div class="card-body">
                    <i class="fa fa-building"></i>
                    <h5 class="card-title">Departments</h5>
                    <h2>{{ departments }}</h2>
                    <a href="/add_department/" class="btn btn-light btn-sm mt-2">Add Department</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-white bg-success text-center">
                <div class="card-body">
                    <i class="fa fa-user-graduate"></i>
                    <h5 class="card-title">Students</h5>
                    <h2>{{ students }}</h2>
                    <a href="/add_student/" class="btn btn-light btn-sm mt-2">Add Student</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-white bg-warning text-center">
                <div class="card-body">
                    <i class="fa fa-chalkboard-teacher"></i>
                    <h5 class="card-title">Supervisors</h5>
                    <h2>{{ supervisors }}</h2>
                    <a href="/add_supervisor/" class="btn btn-light btn-sm mt-2">Add Supervisor</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-white bg-info text-center">
                <div class="card-body">
                    <i class="fa fa-book"></i>
                    <h5 class="card-title">Thesis</h5>
                    <h2>{{ theses }}</h2>
                    <a href="/add_thesis/" class="btn btn-light btn-sm mt-2">Add Thesis</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-white bg-secondary text-center">
                <div class="card-body">
                    <i class="fa fa-clipboard-check"></i>
                    <h5 class="card-title">Evaluations</h5>
                    <h2>{{ evaluations }}</h2>
                    <a href="/add_evaluation/" class="btn btn-light btn-sm mt-2">Add Evaluation</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-white bg-danger text-center">
                <div class="card-body">
                    <i class="fa fa-file-upload"></i>
                    <h5 class="card-title">Submissions</h5>
                    <h2>{{ submissions }}</h2>
                    <a href="/add_submission/" class="btn btn-light btn-sm mt-2">Add Submission</a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
